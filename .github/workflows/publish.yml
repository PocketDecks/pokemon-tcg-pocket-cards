name: Publish to npm

on:
  release:
    types: [published]

jobs:
  package-artifacts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: npm-publish-artifacts-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.16.0

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate TypeScript types
        run: npm run build:types

      - name: Sync version to release tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="$VERSION" node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.version=process.env.VERSION;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          python -c "import sys; sys.path.insert(0, 'scripts'); from build_packages import validate_release_version; validate_release_version('$VERSION')"

      - name: Validate the data before publishing
        run: |
          pip install -r requirements.txt
          pytest -q

      - name: Stage parent package
        run: mkdir -p build/parent && cp -R data LICENSE README.md package.json build/parent/

      - name: Resolve enabled child shapes
        run: |
          SHAPES=$(python -c "import sys; sys.path.insert(0, 'scripts'); from npm_release_shapes import enabled_shapes; print(' '.join(enabled_shapes()))")
          echo "SHAPES=$SHAPES" >> "$GITHUB_ENV"

      - name: Stage child packages
        if: env.SHAPES != ''
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for shape in $SHAPES; do
            python scripts/build_packages.py --version "$VERSION" --out build/pkg --only "$shape"
          done

      - name: Pack and verify release artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python scripts/verify_package_artifacts.py build --version "$VERSION" --staging build/pkg --out build/artifacts --commit "$GITHUB_SHA" --parent build/parent

      - name: Retain release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: build/artifacts/

  publish:
    needs: package-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout publisher
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Download retained release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: build/artifacts

      - name: Publish retained artifacts
        run: python scripts/publish_packages.py --manifest build/artifacts/manifest.json --execute --recovery
